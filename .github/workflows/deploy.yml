name: Deploy

on:
  push:
    branches: [main]

jobs:
  check:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Audit
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: check
    # One deploy at a time, in push order. Without this, two merges in a row deployed in
    # parallel and the older commit could finish last and stay live. A running deploy is
    # never cancelled; a newer push replaces any deploy still waiting.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Checks the Fly origin, not hardwarestack.dev: Cloudflare answers GitHub's runners
      # with 403 as bot traffic, and the origin is what was just deployed (no edge cache).
      # Machines auto-stop when idle, so the first request may hit a cold start: retry.
      - name: Smoke check
        run: |
          set -euo pipefail
          check() {
            local url="https://hardwarestack.fly.dev$1" expect="$2"
            local body
            body=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$url")
            if ! grep -qF "$expect" <<<"$body"; then
              echo "::error::$url loaded but is missing: $expect"
              exit 1
            fi
            echo "ok $url"
          }
          check / "Bottleneck"
          check /bottleneck/amd-ryzen-7-9800x3d-vs-nvidia-geforce-rtx-5090 "Tom&#x27;s Hardware"
          check /local-ai "VRAM"
          check /sitemap.xml "/bottleneck/"
